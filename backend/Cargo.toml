[package]
name = "roisey-else"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
aes-gcm = "0.10.3"
libc = "0.2"
zeroize = "1.8"
argon2 = "0.5.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
data-encoding = "2.10"
http = "1"
http-body-util = "0.1"
hyper = {version="1",default-features=false,features=["client","http1"]}
hyper-util = {version="0.1",default-features=false,features=["tokio"]}
flate2 = { version = "1.1", default-features = false, features = ["zlib-ng"] }
mime = "0.3"
percent-encoding = "2"
pingora-core = { version = "=0.9.0", default-features = false }
rand = "0.9"
redis = {version="=1.7.1",default-features=false,features=["tokio-comp"]}
ring = "0.17"
rustls = {version="0.23",default-features=false,features=["ring","std","tls12"]}
rustls-native-certs = "0.8"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "signal", "net", "io-util"] }
tokio-rustls = {version="0.26",default-features=false,features=["ring","tls12"]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
