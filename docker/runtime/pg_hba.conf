# Administrative peer socket is private to postgres/root. TCP is loopback only.
local all postgres peer
local all all reject
host all postgres 127.0.0.1/32 reject
host else else_migrator 127.0.0.1/32 scram-sha-256
host else else_runtime 127.0.0.1/32 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
