name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable image alias (vMAJOR.MINOR.PATCH)
        required: false
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-auth:
    name: Browser authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real API cookie-session browser flows
        run: sh frontend/scripts/test-auth-browser.sh
      - name: Retain safe synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-auth-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build -mod=readonly -trimpath ./cmd/api ./cmd/migrate ./cmd/healthcheck ./cmd/bootstrap-admin ./cmd/rotate-integration-credentials
      - name: Publication permission and tag boundaries
        run: python3 scripts/test-publication.py
      - name: Dependency scan failure boundaries
        run: python3 scripts/test-dependency-gate.py
      - name: Immutable build metadata input boundaries
        run: python3 scripts/test-build-metadata.py
      - name: Stopped PostgreSQL recovery boundaries
        run: python3 scripts/test-compose-recovery.py
      - name: Workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" ../.github/workflows/ci.yml

  dependencies:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - name: Audit complete frontend dependency lock
        run: npm audit --include=dev --audit-level=info
        working-directory: frontend
      - name: Install pinned official Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan source and integration-tagged tests
        run: |
          PATH="$(go env GOPATH)/bin:$PATH"
          export PATH
          sh backend/scripts/check-go-vulnerabilities.sh

  migrations:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The recovery rehearsal builds a pinned previously integrated API.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - name: Disposable migration and permission tests
        run: sh backend/scripts/test-integration.sh

  containers:
    name: Container integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Single application image verification
        env:
          IMAGE_ARCHIVE_PATH: ${{ runner.temp }}/runtime-images.tar
        run: sh backend/scripts/test-compose.sh
      - name: Retain the tested application image for main publication
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-runtime-images
          path: ${{ runner.temp }}/runtime-images.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish tested main application image
    needs: [frontend, browser-auth, backend, dependencies, migrations, containers]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate publication context and version
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: bash backend/scripts/publish-images.sh --print-tags
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-runtime-images
          path: ${{ runner.temp }}/tested-images
      - run: docker load --input "$RUNNER_TEMP/tested-images/runtime-images.tar"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified application image
        env:
          IMAGE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash backend/scripts/publish-images.sh
