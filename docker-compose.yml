name: roisey-else
services:
  else:
    image: ghcr.io/theroisey/else:latest
    container_name: else
    restart: unless-stopped
    environment:
      HTTP_ADDRESS: 0.0.0.0:8080
      DATABASE_PATH: /var/lib/roisey-else/else.sqlite3
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://localhost:8080}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE:-}
      SMTP_RELAY_IP: ${SMTP_RELAY_IP:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-}
      AUTH_OTP_LIFETIME_SECONDS: ${AUTH_OTP_LIFETIME_SECONDS:-180}
      AUTH_OTP_COOLDOWN_SECONDS: ${AUTH_OTP_COOLDOWN_SECONDS:-60}
      AUTH_OTP_EMAIL_REQUESTS: ${AUTH_OTP_EMAIL_REQUESTS:-3}
      AUTH_OTP_PEER_REQUESTS: ${AUTH_OTP_PEER_REQUESTS:-30}
      AUTH_OTP_GLOBAL_REQUESTS: ${AUTH_OTP_GLOBAL_REQUESTS:-300}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    volumes:
      - else_data:/var/lib/roisey-else
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s

volumes:
  else_data:
    name: roisey-else-data
