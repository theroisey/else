name: roisey-else
services:
  else:
    image: ${ELSE_IMAGE:-ghcr.io/theroisey/else:latest}
    restart: unless-stopped
    env_file: [.env]
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    volumes:
      - else_data:/var/lib/roisey-else
    read_only: true
    tmpfs:
      - /run:rw,nosuid,noexec,size=32m
      - /tmp:rw,nosuid,noexec,size=32m
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s

volumes:
  else_data:
    # Retain the former Compose volume name and PostgreSQL 18 directory layout.
    name: ${ELSE_DATA_VOLUME:-roisey-else_postgres-data}
