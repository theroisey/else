name: roisey-else
services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh docker/dev/prepare.sh first}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Missing migration password}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Missing runtime password}
      POSTGRES_DB: else
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint: [sh, /opt/else/start-postgres.sh]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/start.sh:/opt/else/start-postgres.sh:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-else.sh:ro
      - ./docker/dev/tls:/opt/else/tls-input:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$RUNTIME_PASSWORD" PGSSLMODE=verify-full PGSSLROOTCERT=/opt/else/tls-input/ca.crt psql -h postgres -U else_runtime -d else -tAc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [database]

  backend:
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgres://else_runtime:${RUNTIME_PASSWORD:?Missing runtime password}@postgres:5432/else?sslmode=verify-full&sslrootcert=/etc/else/ca.crt
    volumes:
      - ./docker/dev/tls/ca.crt:/etc/else/ca.crt:ro
    depends_on:
      postgres: {condition: service_healthy}
    stop_grace_period: 15s
    networks: [database, application]

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      backend: {condition: service_healthy}
    networks: [application]

  migrate:
    profiles: [tools]
    build:
      context: ./backend
      target: migration
    environment:
      MIGRATION_DATABASE_URL: postgres://else_migrator:${MIGRATOR_PASSWORD:?Missing migration password}@postgres:5432/else?sslmode=verify-full&sslrootcert=/etc/else/ca.crt
    volumes:
      - ./docker/dev/tls/ca.crt:/etc/else/ca.crt:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]

volumes:
  postgres-data:
networks:
  database:
    internal: true
  application:
