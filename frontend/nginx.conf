server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The API already sends nosniff; keep one canonical edge value.
    proxy_hide_header X-Content-Type-Options;

    location = /status {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /health {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /ready {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
