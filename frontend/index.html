<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Roisey Else client operations platform." />
    <script src="/startup.js"></script>
    <link rel="preload" href="/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/app.webmanifest?v=3" />
    <meta name="application-name" content="Roisey Else" />
    <meta name="apple-mobile-web-app-title" content="Roisey Else" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f2f0ea" />
    <script src="/assets/theme-init.js"></script>
    <title>Roisey Else</title>
  </head>
  <body>
    <section id="startup-error" class="mx-auto max-w-xl px-6 py-16" hidden role="alert">
      <h1 id="startup-title" class="page-title">Application could not load</h1>
      <p id="startup-description" class="mt-4">A required application file is unavailable. Check your connection, then reload. If this continues, contact your administrator.</p>
      <button id="startup-reload" type="button" class="ui-button ui-button-default mt-6 border-line-strong bg-surface px-4 text-ink">Reload application</button>
    </section>
    <div id="root">
      <main class="boot-loading" aria-busy="true">
        <img src="/assets/roisey-logo.svg" width="32" height="32" alt="Roisey Else" />
        <div class="boot-progress" role="progressbar" aria-label="Roisey Else"></div>
      </main>
    </div>
    <noscript>Enable JavaScript to use Roisey Else.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
